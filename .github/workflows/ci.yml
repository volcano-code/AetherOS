name: CI

on:
  push:
    branches: [main, develop, "phase0/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned Hermes submodule metadata
        run: bash scripts/verify_upstream_pin.sh
      - name: Compile AetherOS
        run: python -m compileall -q aetheros
      - name: AetherOS contract tests
        run: python -m unittest discover -s tests -v
