[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheros-control-plane"
version = "0.1.0"
description = "Controlled personal-agent orchestration and Harness improvement control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AetherOS Contributors" }]

[tool.setuptools.packages.find]
include = ["aetheros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
